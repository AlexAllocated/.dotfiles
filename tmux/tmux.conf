# Keep tmux portable across Ghostty, Kitty, WezTerm, SSH, WSL, and macOS.
# C-b remains the standard prefix used by upstream documentation and tutorials.

set -g detach-on-destroy off
set -g display-time 1500
set -s exit-empty off
set -wg alternate-screen on

# Refresh desktop-specific variables when a client creates or reattaches to a
# session. New windows then inherit the current compositor and login session
# rather than the environment from when the long-lived server first started.
# Numbered entries keep repeated source-file calls idempotent.
set -g update-environment[100] WAYLAND_DISPLAY
set -g update-environment[101] DBUS_SESSION_BUS_ADDRESS
set -g update-environment[102] XDG_RUNTIME_DIR
set -g update-environment[103] XDG_CURRENT_DESKTOP
set -g update-environment[104] XDG_SESSION_DESKTOP
set -g update-environment[105] XDG_SESSION_TYPE
set -g update-environment[106] XDG_SESSION_ID
set -g update-environment[107] XDG_SESSION_PATH
set -g update-environment[108] DESKTOP_SESSION
set -g update-environment[109] NIRI_SOCKET
set -g update-environment[110] MANGO_INSTANCE_SIGNATURE
set -g update-environment[111] KDE_FULL_SESSION
set -g update-environment[112] KDE_SESSION_VERSION
set -g update-environment[113] XDG_SEAT
set -g update-environment[114] XDG_SEAT_PATH
set -g update-environment[115] XDG_VTNR

# Modern terminal capabilities. Numbered entries make reloads idempotent.
set -s set-clipboard on
set -s copy-command ''
set -wg allow-passthrough on
set -s terminal-features[100] 'xterm-ghostty:RGB:clipboard'
set -s terminal-features[101] 'xterm-kitty:RGB:clipboard'
set -s terminal-features[102] 'wezterm:RGB:clipboard'
set -s terminal-features[103] 'xterm-256color:RGB:clipboard'
set -s terminal-features[104] 'alacritty*:RGB:clipboard'

# Gruvbox Dark Hard. Define the final colors explicitly after the packaged
# theme loads so the status line does not depend on terminal palette slots.
# Rectangular segments form one continuous bar anchored to the terminal edge.
set -g status-interval 5
set -g status-position top
set -g status on
set -gu status-format[1]
set -g status-style 'bg=#282828,fg=#ebdbb2'
set -g status-left-length 80
set -g status-right-length 100
set -g status-left '#[fg=#1d2021,bg=#98971a,bold] #S '
set -g status-right '#[fg=#a89984,bg=#3c3836,nobold] %a %b %d #[fg=#1d2021,bg=#458588,bold] %H:%M #[fg=#ebdbb2,bg=#504945,nobold] #h '
set -g window-status-separator ''
set -g window-status-style 'bg=#3c3836,fg=#ebdbb2'
set -g window-status-format '#[fg=#ebdbb2,bg=#3c3836,nobold] #I:#W#{?window_zoomed_flag, Z,}#{?window_bell_flag,#[fg=#fb4934] !#[fg=#ebdbb2],} '
set -g window-status-current-style 'bg=#fe8019,fg=#1d2021,bold'
set -g window-status-current-format '#[fg=#1d2021,bg=#fe8019,bold] #I:#W#{?window_zoomed_flag, Z,}#{?window_bell_flag, !,} '
set -g window-status-bell-style 'bg=#3c3836,fg=#fb4934,bold'
set -g message-style 'bg=#3c3836,fg=#fbf1c7'
set -g message-command-style 'bg=#504945,fg=#fbf1c7'
set -g mode-style 'bg=#458588,fg=#1d2021,bold'
set -g pane-border-style 'fg=#3c3836'
set -g pane-active-border-style 'fg=#fe8019'
set -g clock-mode-colour '#83a598'

# Keep tmux 3.6's pane-management context menu disabled without assigning any
# clipboard behavior to right-click.
unbind-key -T root MouseDown3Pane

# Bindings intentionally remain stock. C-b ? opens tmux's live key reference,
# so documentation and tutorials always match this machine.
