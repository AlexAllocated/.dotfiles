[package]
name = "audioarray-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Intrepid-class AudioArray operations console"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
audioarray = { path = "../.." }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_JobObjects",
	"Win32_System_Threading",
	"Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
