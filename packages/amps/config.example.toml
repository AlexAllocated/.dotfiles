# VAC's playback and recording endpoints share these semantic names but occupy
# opposite device directions. AMPS deliberately refuses ambiguous matches.
[cables]
game = "AMPS Game (Virtual Audio Cable)"
comms = "AMPS Comms Audio (Virtual Audio Cable)"
# Keep the internal key stable so saved routes and app assignments survive renames.
music = "AMPS Media (Virtual Audio Cable)"
chatgpt = "AMPS AI Audio (Virtual Audio Cable)"
chatgpt_in = "AMPS AI Mic (Virtual Audio Cable)"
comms_send = "AMPS Comms Mic (Virtual Audio Cable)"
clean_mic = "AMPS Clean Mic (Virtual Audio Cable)"

[monitor]
# On first launch, "default" remembers the current physical Windows playback
# device. AMPS then makes Game the Windows default and treats any later
# physical choice in the Windows picker as a request to change the monitor at
# the end of every bus. The remembered choice is machine-local.
output = "default"
# Sunshine makes this endpoint the Windows default during Moonlight sessions.
# AMPS observes that real transition, temporarily sends the complete mix
# here, then falls back through remembered physical outputs at disconnect.
remote_output = "Speakers (Steam Streaming Speakers)"
# AMPS detects the OculusDash runtime while Quest Link is active and
# routes the complete bus mix here without replacing the remembered local
# output. Configure Meta Horizon to preserve Windows audio defaults so Game,
# Comms, and Clean Mic remain stable application-facing endpoints.
vr_output = "Headphones (Oculus Virtual Audio Device)"
latency_ms = 35
game_gain = 1.0
comms_gain = 1.0
music_gain = 1.0
chatgpt_gain = 1.0

[microphone]
# On first launch, "default" remembers the current physical Windows recording
# device. AMPS then makes Clean Mic the Windows default and treats any
# later physical choice in the Windows picker as the raw microphone feeding
# the selected noise processor and Clean Mic. Physical inputs and outputs are
# remembered in recency order; an unplugged selection falls back to the next
# usable device.
input = "default"
# Quest Link is a session override, not a remembered physical preference. When
# Meta makes the Oculus headphones active, its microphone temporarily becomes
# the raw source feeding the selected noise processor and Clean Mic. Disconnecting Quest
# automatically restores the most recent available local microphone.
vr_input = "Headset Microphone (Oculus Virtual Audio Device)"
latency_ms = 45
gain = 1.0

[noise_suppression]
enabled = true
engine = "nvidia_afx"
# Select "nvidia_afx" for NVIDIA RTX Audio Effects or "deepfilternet3" for
# the embedded CPU model. Backend failures remain visible instead of silently
# changing algorithms.
# The interface presents this 20 dB DeepFilterNet3 default as 50% intensity on
# a 0-40 dB scale and passes the same 50% ratio to NVIDIA AFX. UI choices live
# in machine-local controls.toml and override this base.
attenuation_limit_db = 20.0
# The post-filter adds extra suppression after inference and is unnecessary for
# a communications mic where speech continuity matters more than total silence.
post_filter_beta = 0.0

[patchbay]
# These unity-gain links behave like plugging cables into a small hardware
# patch panel. Clean Mic is filtered physical speech only, never a mixed sink.
# AI Mic hears Clean Mic + Comms Audio. Comms Mic hears Clean Mic + AI Audio.
# Neither conversation receives its own playback. Saved choices remain
# authoritative; setup-conversation is an explicit one-time migration command.
connections = [
   { source = "game", destination = "monitor" },
   { source = "comms", destination = "monitor" },
   { source = "music", destination = "monitor" },
   { source = "chatgpt", destination = "monitor" },
   { source = "clean_mic", destination = "comms_send" },
   { source = "clean_mic", destination = "chatgpt_in" },
   { source = "comms", destination = "chatgpt_in" },
   { source = "chatgpt", destination = "comms_send" },
]

# These are persisted Windows per-app endpoint preferences. AMPS applies
# them whenever it sees the process, so reinstalls and process replacement do
# not silently bypass the graph. Unmatched applications inherit the Windows
# default Game bus. Only applications that belong on Comms or Media require an
# explicit output route.
[[routes]]
process = "Discord.exe"
output = "comms"
input = "comms_send"

[[routes]]
process = "Vesktop.exe"
output = "comms"
input = "comms_send"

[[routes]]
process = "ChatGPT.exe"
output = "chatgpt"
input = "chatgpt_in"

[[routes]]
process = "Codex.exe"
output = "chatgpt"
input = "chatgpt_in"

[[routes]]
process = "Spotify.exe"
output = "music"

[[routes]]
process = "RustClient.exe"
output = "game"

[[routes]]
process = "Wow.exe"
output = "game"

[[routes]]
process = "Diablo IV.exe"
output = "game"

[[routes]]
process = "Overwatch.exe"
output = "game"
